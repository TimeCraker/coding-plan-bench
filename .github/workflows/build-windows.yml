name: Build Windows App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (如 v0.1.0)"
        required: true
        default: "v0.1.0"

jobs:
  build-tauri:
    runs-on: windows-latest
    permissions:
      contents: write # 允许创建 release
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag }}
          releaseName: "Coding Plan Bench ${{ github.event.inputs.tag }}"
          releaseBody: "本地版下载（Windows）。双击运行，key 全程本地不出门。"
          releaseDraft: false
          prerelease: false
