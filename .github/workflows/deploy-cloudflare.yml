name: Deploy Site (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# 需要 GitHub Secrets:
#   CLOUDFLARE_API_TOKEN  - Cloudflare API Token（Pages:Edit 权限）
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare Account ID
# 未配置时 workflow 会失败但不影响代码；可改用手动 `npx wrangler pages deploy`

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 仅当代码改动 site/ 或 engine/ 时才有意义，但为简化全量部署
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build
        env:
          # Worker API 兜底地址（浏览器直调失败时走这里）
          VITE_API_BASE: https://coding-plan-bench-api.timecraker-ace.workers.dev/api
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=coding-plan-bench --branch=main
